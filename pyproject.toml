[build-system]
# jaxlib is build-time only — scikit-build-core installs it into the isolated
# build env so CMake's XLA FFI probe can find xla/ffi/api/ffi.h. The produced
# wheel has no runtime dependency on jaxlib.
requires = ["scikit-build-core>=0.10", "jaxlib>=0.5.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pysiglib"
version = "3.0.0rc1"
description = "Fast Signature Computations on CPU and GPU"
requires-python = ">=3.9"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Daniil Shmelev", email = "daniil.shmelev23@imperial.ac.uk" },
]
dependencies = ["numpy", "torch", "kauri>=2.1.0"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
jax  = ["jax"]
cuda = ["pysiglib-cuda==3.0.0rc1"]

[project.urls]
Homepage = "https://github.com/daniil-shmelev/pySigLib"

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["pysiglib"]
wheel.py-api = "py3"
sdist.exclude = [
    "tests/",
    "docs/",
    ".github/",
    "*.psd",
    "*.vcxproj",
    "*.vcxproj.filters",
    ".readthedocs.yaml",
    "codecov.yml",
]

[tool.scikit-build.cmake.define]
PYSIGLIB_JAX_FFI = {env = "PYSIGLIB_JAX_FFI", default = "ON"}
PYSIGLIB_AVX     = {env = "SIGLIB_VEC", default = "ON"}

# -----------------------------------------------------------------------
# cibuildwheel configuration (used by .github/workflows/release.yml)
# -----------------------------------------------------------------------
# Defaults assume CPU-only. Each CI job overrides CIBW_ENVIRONMENT
# (and CIBW_MANYLINUX_X86_64_IMAGE for the CUDA Linux build) as needed.
# These settings are only read when cibuildwheel is invoked — a plain
# `pip install .` uses scikit-build-core directly and ignores this block.
[tool.cibuildwheel]
build = "cp311-*"
skip = "pp* *-musllinux_* *-win32 *i686"
build-verbosity = 1
environment = { SIGLIB_VEC = "ON" }
test-requires = ["pytest"]
test-command = 'python -c "import pysiglib, pysiglib.torch_api; print(f\"imports OK: pysiglib {pysiglib.__version__}, BUILT_WITH_CUDA={pysiglib.load_siglib.BUILT_WITH_CUDA}, BUILT_WITH_AVX={pysiglib.load_siglib.BUILT_WITH_AVX}\")"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
# CUDA Linux build overrides manylinux-x86_64-image to a custom manylinux+CUDA image;
# the libcuda/libnvidia excludes are harmless for CPU wheels (nothing to exclude).
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude 'libcuda.so*' --exclude 'libnvidia-*'"

[tool.cibuildwheel.macos]
# arm64-only: Intel Mac cross-compile from arm64 hosts on GHA surfaced a
# series of hard-to-solve issues (OS-based SIMD guards, missing std::filesystem
# support, -march=native mis-resolution) that weren't worth fighting for a
# target audience of ~zero. macosx_arm64 covers all modern Mac users.
archs = ["arm64"]

[tool.coverage.run]
source_pkgs = ["pysiglib"]

[tool.coverage.paths]
pysiglib = ["pysiglib/", "*/site-packages/pysiglib/"]

# -----------------------------------------------------------------------
# Uploading to PyPI
# -----------------------------------------------------------------------
# To distribute the package, build an sdist and upload via twine:
#
#   pip install build twine
#   python -m build --sdist
#   twine check dist/*
#   twine upload -r testpypi dist/*
#
