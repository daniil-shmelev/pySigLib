[build-system]
# jaxlib provides the XLA FFI headers at build time. Pinned to >=0.9.1 so the
# headers expose XLA_FFI_API_MINOR=3 (needed by our compiled handlers). Skipped
# on Python <3.11 (jax dropped 3.10 in 0.7.0); CMake then disables JAX FFI.
requires = [
    "scikit-build-core>=0.10",
    "jaxlib>=0.9.1; python_version>='3.11'",
]
build-backend = "scikit_build_core.build"

[project]
name = "pysiglib"
dynamic = ["version", "optional-dependencies"]
description = "Fast Signature Computations on CPU and GPU"
keywords = [
    "signatures",
    "path signatures",
    "log signatures",
    "signature kernels",
    "branched signatures",
    "rough paths",
    "iterated integrals",
    "time series",
    "machine learning",
    "scientific computing",
    "gpu",
    "cuda",
    "numpy",
    "pytorch",
    "jax",
]
requires-python = ">=3.9"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Daniil Shmelev", email = "daniil.shmelev23@imperial.ac.uk" },
]
dependencies = ["numpy", "torch", "kauri>=2.3.0"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# [project.optional-dependencies] is dynamic - see [tool.scikit-build.metadata.optional-dependencies].
# The cuda extra's pysiglib-cuda==<version> pin is generated from pysiglib/_version.py at build time.

[project.urls]
Homepage = "https://github.com/daniil-shmelev/pySigLib"

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["pysiglib"]
wheel.py-api = "py3"
# Required for the custom _pin_provider metadata provider below
# (scikit-build-core gates non-built-in providers behind this flag).
experimental = true
sdist.exclude = [
    "tests/",
    "docs/",
    ".github/",
    "*.psd",
    "*.vcxproj",
    "*.vcxproj.filters",
    ".readthedocs.yaml",
    "codecov.yml",
]

# Single source of truth for version: pysiglib/_version.py.
# Bumping that file flows through to wheel metadata, runtime __version__,
# Sphinx release tag, the plugin's wheel metadata, and the cuda extra below.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "pysiglib/_version.py"

# Custom provider that reads the same _version.py and emits the cuda extra's
# pysiglib-cuda==<version> pin. See _pin_provider.py.
[tool.scikit-build.metadata.optional-dependencies]
provider = "_pin_provider"
provider-path = "."

[tool.scikit-build.cmake.define]
PYSIGLIB_JAX_FFI = {env = "PYSIGLIB_JAX_FFI", default = "ON"}
PYSIGLIB_AVX     = {env = "SIGLIB_VEC", default = "ON"}

# cibuildwheel config (release.yml only). `pip install .` ignores this.
[tool.cibuildwheel]
build = "cp311-*"
skip = "*-musllinux_* *-win32 *i686"
build-verbosity = 1
environment = { SIGLIB_VEC = "ON" }
test-requires = ["pytest"]
test-command = 'python -c "import pysiglib, pysiglib.torch_api; print(f\"imports OK: pysiglib {pysiglib.__version__}, BUILT_WITH_CUDA={pysiglib.load_siglib.BUILT_WITH_CUDA}, BUILT_WITH_AVX={pysiglib.load_siglib.BUILT_WITH_AVX}\")"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
# Exclude system-CUDA libs (libcuda, libnvidia) and our own bundled libs
# (libcpsig, libcusig, libpysiglib_jax_ffi_cpu) from auditwheel dependency resolution.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude 'libcuda.so*' --exclude 'libnvidia-*' --exclude 'libcpsig.so*' --exclude 'libcusig.so*' --exclude 'libpysiglib_jax_ffi_cpu.so*'"

[tool.cibuildwheel.macos]
# arm64 only. Intel Mac cross-compile has too many toolchain issues for ~zero users.
archs = ["arm64"]
# --ignore-missing-dependencies: our bundled dylibs reference each other
# (libpysiglib_jax_ffi_cpu -> libcpsig); all in pysiglib/, loaded via ctypes.
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} --ignore-missing-dependencies"

[tool.coverage.run]
source_pkgs = ["pysiglib"]

[tool.coverage.paths]
pysiglib = ["pysiglib/", "*/site-packages/pysiglib/"]

# -----------------------------------------------------------------------
# Uploading to PyPI
# -----------------------------------------------------------------------
# To distribute the package, build an sdist and upload via twine:
#
#   pip install build twine
#   python -m build --sdist
#   twine check dist/*
#   twine upload -r testpypi dist/*
#
