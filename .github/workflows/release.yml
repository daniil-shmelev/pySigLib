name: Release

# Builds pysiglib and pysiglib-cuda wheels, then tests fresh installs across
# the supported platforms. This workflow does not publish to PyPI.
#
# Prerequisites before first run:
#   1. Run `build-cuda-images.yml` once to publish the manylinux build image
#      and CUDA test image to GHCR.
#   2. Register a self-hosted Windows runner with Docker Desktop + WSL2 + the
#      NVIDIA driver, labelled [self-hosted, Windows, X64].

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version you intend to release (asserted against pysiglib.__version__ in every test job — fails if the built wheels do not match).'
        type: string
        required: true
      run_gpu_tests:
        description: 'Run GPU test jobs on the self-hosted Windows runner.'
        type: boolean
        default: true

env:
  # Shared CUDA arch list for Linux and Windows plugin builds.
  CUDA_ARCH: "50;60;70;75;80;86;89;90;100;120"
  # Pre-built CUDA test image from build-cuda-images.yml.
  TEST_CUDA_IMAGE: ghcr.io/daniil-shmelev/pysiglib-test-cuda12:cuda-12.9.1

permissions:
  contents: read

jobs:
  # ============================================================
  # Linux CPU wheel
  # ============================================================
  build-linux-cpu:
    name: Build Linux CPU wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ENVIRONMENT: SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-cpu
          path: wheelhouse/*.whl

  # ============================================================
  # Linux CUDA wheel
  # ============================================================
  build-linux-cuda:
    name: Build Linux CUDA plugin wheel (pysiglib-cuda)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Compute image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/pysiglib-manylinux-cuda12:cuda-12.9.1" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: plugins/cuda
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ steps.image.outputs.name }}
          # Quote CUDA_ARCH so cibuildwheel keeps the semicolon-delimited list intact.
          CIBW_ENVIRONMENT: 'CUDA_ARCH="${{ env.CUDA_ARCH }}"'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-cuda
          path: wheelhouse/*.whl

  # ============================================================
  # Windows CPU wheel
  # ============================================================
  build-windows-cpu:
    name: Build Windows CPU wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ENVIRONMENT: SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-cpu
          path: wheelhouse/*.whl

  # ============================================================
  # Windows CUDA wheel
  # ============================================================
  build-windows-cuda:
    name: Build Windows CUDA plugin wheel (pysiglib-cuda)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install CUDA toolkit
        # Use Windows-native sub-package names; on Windows `cudart` already
        # includes the runtime libraries and headers.
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "thrust", "visual_studio_integration"]'
      - name: Verify nvcc
        shell: pwsh
        run: nvcc --version
      - uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: plugins/cuda
        env:
          # Quote CUDA_ARCH so cibuildwheel keeps the semicolon-delimited list intact.
          CIBW_ENVIRONMENT: 'CUDA_ARCH="${{ env.CUDA_ARCH }}"'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-cuda
          path: wheelhouse/*.whl

  # ============================================================
  # macOS wheel
  # ============================================================
  build-macos:
    name: Build macOS wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ENVIRONMENT: SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: wheelhouse/*.whl

  # ============================================================
  # Test jobs — install the built wheels in a fresh environment and
  # run the test suite. These validate both "the wheel installs cleanly"
  # and "the Python code continues to work end-to-end" across the minimum
  # (3.9) and latest (3.13) Python versions we support.
  # ============================================================

  test-linux-cpu:
    name: Test Linux CPU wheel (py${{ matrix.python-version }})
    needs: build-linux-cpu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - name: Install wheel + test deps
        run: |
          pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest
      - name: Verify installed version matches input
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Run test suite
        run: pytest tests/ -v

  # ============================================================
  # Linux distro compatibility matrix. The main test-linux-cpu job above
  # only exercises ubuntu-latest; this one runs the *same* CPU wheel
  # against a spread of real distros (different glibc versions, different
  # package managers) to catch glibc-edge and linker issues that
  # manylinux's static analysis cannot cover. Rocky 8 is particularly
  # important — its glibc 2.28 is the exact lower bound of the
  # manylinux_2_28 tag the wheel claims. Rocky 8's default python3 is 3.6
  # (below our >=3.9 requirement) so we install python39 as a fallback.
  test-linux-distros:
    name: Test Linux CPU wheel on ${{ matrix.distro }}
    needs: build-linux-cpu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - debian:11
          - rockylinux:8
          - rockylinux:9
          - fedora:40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - name: Test wheel in ${{ matrix.distro }} container
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e EXPECTED_VERSION \
            ${{ matrix.distro }} \
            bash -c '
              set -e
              # Install python >= 3.9 + pip via the distro package manager.
              if [ -f /etc/debian_version ]; then
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                    python3 python3-pip git ca-certificates
                PY=python3
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y -q git ca-certificates python3 python3-pip
                # Rocky 8 ships python3=3.6, too old for pysiglib. Install
                # python39 as a fallback and use python3.9 directly.
                if python3 -c "import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)"; then
                  PY=python3
                else
                  dnf install -y -q python39
                  PY=python3.9
                fi
              else
                echo "Unsupported distro: no apt-get or dnf" >&2
                exit 1
              fi
              $PY --version
              $PY -m pip install --quiet --upgrade pip
              $PY -m pip install --quiet /workspace/dist/*.whl pytest
              # Version check — same contract as the other test jobs.
              $PY -c "import os, pysiglib; expected=os.environ[\"EXPECTED_VERSION\"]; actual=pysiglib.__version__; assert actual==expected, \"Version mismatch: built wheel reports \"+actual+\", workflow input expected \"+expected; print(\"Version verified:\", actual)"
              # Run pytest from /tmp with importlib import mode so Python
              # resolves `import pysiglib` from site-packages rather than
              # from the checked-out /workspace/pysiglib/ source tree.
              cd /tmp
              $PY -m pytest --import-mode=importlib /workspace/tests/ -v
            '

  # ============================================================
  # Single manual-approval gate for all GPU tests. Every CUDA test job below
  # declares `needs: gate-cuda-tests`, so the `deployment` environment
  # protection rule triggers exactly once per workflow run — the user
  # approves GPU tests as a group at the start of the run, not once per
  # CUDA wheel. Adding a new CUDA test job requires no new approvals.
  gate-cuda-tests:
    name: Approve GPU tests
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    environment: deployment
    runs-on: ubuntu-latest
    steps:
      - run: echo "GPU tests approved - proceeding on the self-hosted runner."

  # ============================================================
  # test-linux-cuda and test-windows-cuda both run on the SELF-HOSTED Windows
  # runner. That runner has Docker Desktop + WSL2 + the NVIDIA driver, so a
  # Linux container started with --gpus all can reach the host's RTX 4060;
  # Windows-native tests (test-windows-cuda) exec directly against the host
  # GPU because the Windows CUDA wheel already bundles cudart via delvewheel.
  #
  # The Linux test image is pre-built by build-test-image.yml and pushed to
  # ghcr.io with torch + pytest baked in, so test-linux-cuda only needs to
  # `pip install` the wheel under test (~seconds) instead of redownloading
  # ~2 GB of torch on every run.
  #
  # Security model (applies to both CUDA test jobs below):
  #   1. release.yml only triggers on workflow_dispatch (no PR trigger), so
  #      fork PRs structurally cannot fire these jobs.
  #   2. The actor check below restricts execution to manual triggers from
  #      the canonical repo.
  #   3. The upstream gate-cuda-tests job routes through the `deployment`
  #      environment for a single manual approval that authorizes every
  #      CUDA test job in the run.
  #   4. test-linux-cuda runs inside an ephemeral Docker container destroyed
  #      with --rm, so any code that does run cannot persist on the host or
  #      read host files outside the workspace mount. test-windows-cuda
  #      cannot use the same container trick because the wheel is Windows
  #      native, so it relies on items 1-3 above plus the canonical-repo
  #      actor check for isolation.
  test-linux-cuda:
    name: Test Linux CUDA wheel (GPU)
    needs:
      - build-linux-cpu
      - build-linux-cuda
      - gate-cuda-tests
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        # Windows PowerShell 5.1 on self-hosted runners defaults to the
        # 'Restricted' execution policy, which refuses to source GHA's
        # generated .ps1 wrapper scripts. Add -ExecutionPolicy Bypass so
        # workflows run on a fresh runner without the user having to modify
        # the host's execution policy (which would also be a global change
        # affecting other software on the machine).
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      # Both the base pysiglib wheel (contains cpsig + CPU JAX FFI) and the
      # pysiglib-cuda plugin wheel (contains cusig) must be installed for
      # CUDA tests to run. The base wheel is downloaded first; the plugin
      # wheel is then downloaded into the same `dist/` directory so a single
      # `pip install dist/*.whl` inside the test container picks up both.
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cuda
          path: dist
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull test image
        run: docker pull ${{ env.TEST_CUDA_IMAGE }}
      - name: Run pytest in ephemeral test container with --gpus all
        # pytest-timeout kills any single test that runs longer than 60s, so
        # a hung kernel cannot consume the whole job budget. The self-hosted
        # Windows runner has no bash installed (C:\Windows\System32\bash.exe
        # dispatches to WSL, which isn't set up), so the step runs in
        # powershell. The test script is written to the workspace as LF-only,
        # BOM-less UTF-8 so the Linux container's bash can parse it cleanly.
        # EXPECTED_VERSION is forwarded into the container via -e so the
        # version-check line inside the bash script can read it.
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $scriptBody = @'
          set -e
          python3 -m pip install --quiet /workspace/dist/*.whl
          python3 -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
          nvidia-smi
          python3 -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
          python3 -c "import pysiglib; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
          pytest /workspace/tests/ -v --timeout=60
          '@
          $ws = $env:GITHUB_WORKSPACE
          $scriptPath = Join-Path $ws "run-cuda-tests.sh"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($scriptPath, $scriptBody.Replace("`r`n", "`n"), $utf8NoBom)
          docker run --rm --gpus all `
            -v "${ws}:/workspace" `
            -w /tmp `
            -e EXPECTED_VERSION="$env:EXPECTED_VERSION" `
            ${{ env.TEST_CUDA_IMAGE }} `
            bash /workspace/run-cuda-tests.sh

  test-windows-cuda:
    name: Test Windows CUDA wheel (py${{ matrix.python-version }})
    needs:
      - build-windows-cpu
      - build-windows-cuda
      - gate-cuda-tests
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    runs-on: [self-hosted, Windows, X64]
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    defaults:
      run:
        # Same Restricted-execution-policy override as test-linux-cuda;
        # needed because Windows PowerShell 5.1 on the self-hosted runner
        # otherwise refuses to source GHA's generated .ps1 wrapper.
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Both the base pysiglib wheel (cpsig + CPU JAX FFI) and the
      # pysiglib-cuda plugin wheel (cusig) must be installed.
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cuda
          path: dist
      - name: Install wheels + test deps
        run: |
          python -m pip install --upgrade pip
          Get-ChildItem dist\*.whl | ForEach-Object { pip install $_.FullName }
          pip install pytest pytest-timeout torch
      - name: Verify installed version matches input
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Verify GPU + CUDA visibility
        run: |
          nvidia-smi
          python -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
          python -c "import pysiglib; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
      - name: Run full test suite
        run: pytest tests/ -v --timeout=60

  test-windows-cpu:
    name: Test Windows CPU wheel (py${{ matrix.python-version }})
    needs: build-windows-cpu
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - name: Install wheel + test deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          Get-ChildItem dist\*.whl | ForEach-Object { pip install $_.FullName }
          pip install pytest
      - name: Verify installed version matches input
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Run CPU test suite
        shell: pwsh
        run: pytest tests/ -v

  test-macos:
    name: Test macOS wheel (py${{ matrix.python-version }})
    needs: build-macos
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos
          path: dist
      - name: Install wheel + test deps
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest
      - name: Verify installed version matches input
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Run CPU test suite
        run: pytest tests/ -v

  # ============================================================
  # Aggregate all built wheels into one downloadable artifact
  # ============================================================
  collect-wheels:
    name: Collect all wheels
    needs:
      - build-linux-cpu
      - build-linux-cuda
      - build-windows-cpu
      - build-windows-cuda
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List collected wheels
        run: |
          ls -la dist/
          echo ""
          for f in dist/*.whl; do
            size=$(du -h "$f" | cut -f1)
            echo "$size  $(basename "$f")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: dist/*.whl
