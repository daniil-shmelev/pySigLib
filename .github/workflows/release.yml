name: Release

# Builds pysiglib and pysiglib-cuda wheels, tests fresh installs across the
# supported platforms, and (optionally, gated by `publish_to_pypi`) publishes
# to TestPyPI, installs from TestPyPI and runs the test suite, then publishes
# to PyPI.
#
# Prerequisites before first run:
#   1. Run `build-cuda-images.yml` once to publish the manylinux build image
#      and CUDA test image to GHCR.
#   2. Register a self-hosted Windows runner with Docker Desktop + WSL2 + the
#      NVIDIA driver, labelled [self-hosted, Windows, X64].
#   3. To enable PyPI publishing (publish_to_pypi=true):
#      a. Configure Trusted Publishing on TestPyPI and PyPI for both the
#         `pysiglib` and `pysiglib-cuda` projects. Each trusted publisher
#         entry must point at this repo, this workflow file, and the
#         environment name (`testpypi` / `pypi`).
#      b. Create three GitHub repo environments:
#         - `testpypi` - OIDC binding only, NO required reviewers.
#         - `pypi`     - OIDC binding only, NO required reviewers.
#         - `deployment` - required reviewers = release approvers. This is
#           the single approval surface used by the three gate jobs
#           (gate-cuda-tests, approve-testpypi-publish, approve-pypi-publish).
#         Each gate is a dedicated `environment: deployment` job that pauses
#         for manual approval before downstream work proceeds. Do NOT put
#         reviewers on `testpypi` or `pypi` - double-gating the same env
#         would cause a duplicate prompt on every publish job.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version you intend to release (asserted against pysiglib.__version__ in every test job — fails if the built wheels do not match).'
        type: string
        required: true
      run_gpu_tests:
        description: 'Run GPU test jobs on the self-hosted Windows runner.'
        type: boolean
        default: true
      publish_to_pypi:
        description: 'Publish to TestPyPI, run a fresh-install smoke test, then publish to PyPI. Requires Trusted Publishing + `testpypi` / `pypi` environments to be configured (see release.yml header).'
        type: boolean
        default: false

env:
  # Shared CUDA arch list for Linux and Windows plugin builds.
  CUDA_ARCH: "50;60;70;75;80;86;89;90;100;120"
  # Pre-built CUDA build image from build-cuda-images.yml.
  MANYLINUX_CUDA_IMAGE: ghcr.io/daniil-shmelev/pysiglib-manylinux-cuda12:cuda-12.9.1
  # Pre-built CUDA test image from build-cuda-images.yml.
  TEST_CUDA_IMAGE: ghcr.io/daniil-shmelev/pysiglib-test-cuda12:cuda-12.9.1
  # Use an explicit CUDA PyTorch index for Windows GPU tests.
  PYTORCH_CUDA_INDEX: https://download.pytorch.org/whl/cu128

permissions:
  contents: read

jobs:
  # ============================================================
  # Linux CPU wheel
  # ============================================================
  build-linux-cpu:
    name: Build Linux CPU wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ENVIRONMENT: SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-cpu
          path: wheelhouse/*.whl

  # ============================================================
  # Linux CUDA wheel
  # ============================================================
  build-linux-cuda:
    name: Build Linux CUDA plugin wheel (pysiglib-cuda)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Compute image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/pysiglib-manylinux-cuda12:cuda-12.9.1" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pre-pull CUDA build image
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "${{ steps.image.outputs.name }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Image pull failed after 5 attempts."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Image pull failed (attempt $attempt), retrying in ${delay}s..."
            sleep "$delay"
          done
      - uses: pypa/cibuildwheel@v3.2
        with:
          package-dir: plugins/cuda
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ steps.image.outputs.name }}
          # Quote CUDA_ARCH so cibuildwheel keeps the semicolon-delimited list intact.
          CIBW_ENVIRONMENT: 'CUDA_ARCH="${{ env.CUDA_ARCH }}"'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-cuda
          path: wheelhouse/*.whl

  # ============================================================
  # Windows CPU wheel
  # ============================================================
  build-windows-cpu:
    name: Build Windows CPU wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ENVIRONMENT: SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-cpu
          path: wheelhouse/*.whl

  # ============================================================
  # Windows CUDA wheel
  # ============================================================
  build-windows-cuda:
    name: Build Windows CUDA plugin wheel (pysiglib-cuda)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      # Cache CUDA + the VS BuildCustomizations dir where visual_studio_integration
      # drops MSBuild .props/.targets; skipping that dir breaks "No CUDA toolset
      # found" on cache hit. Bump the key suffix when version/subpackages change.
      - name: Cache CUDA toolkit
        id: cuda-cache
        uses: actions/cache@v5
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9
            C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations
          key: cuda-win-12.9.1-nvcc-cudart-thrust-vsint-v2
      - name: Install CUDA toolkit
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "thrust", "visual_studio_integration"]'
      - name: Expose CUDA env on cache hit
        if: steps.cuda-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          "CUDA_PATH=$root"        | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_PATH_V12_9=$root"  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_HOME=$root"        | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$root\bin"              | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$root\libnvvp"          | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Verify nvcc
        shell: pwsh
        run: nvcc --version
      - uses: pypa/cibuildwheel@v3.2
        with:
          package-dir: plugins/cuda
        env:
          # Quote CUDA_ARCH so cibuildwheel keeps the semicolon-delimited list intact.
          CIBW_ENVIRONMENT: 'CUDA_ARCH="${{ env.CUDA_ARCH }}"'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-cuda
          path: wheelhouse/*.whl

  # ============================================================
  # macOS wheel
  # ============================================================
  build-macos:
    name: Build macOS wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ENVIRONMENT: SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: wheelhouse/*.whl

  # ============================================================
  # Test jobs — install the built wheels in a fresh environment and
  # run the test suite. These validate both "the wheel installs cleanly"
  # and "the Python code continues to work end-to-end" across the minimum
  # (3.9) and latest (3.13) Python versions we support.
  # ============================================================

  test-linux-cpu:
    name: Test Linux CPU wheel (py${{ matrix.python-version }})
    needs: build-linux-cpu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - name: Install wheel + test deps
        run: |
          pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      # Downstream steps use `working-directory: ${{ runner.temp }}` so `import
      # pysiglib` resolves to the installed wheel, not the checked-out source
      # tree (which lacks the generated _config.py and native libs).
      - name: Verify installed version matches input
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Run test suite
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
      - name: Run C++ CPU tests
        if: matrix.python-version == '3.13'
        run: |
          cmake -S . -B build_cpp_tests -DPYSIGLIB_TESTS=ON -DPYSIGLIB_BENCHMARKS=OFF -DPYSIGLIB_JAX_FFI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build_cpp_tests --target cpsig_tests --config Release --parallel 4
          ctest --test-dir build_cpp_tests --output-on-failure -C Release
  # ============================================================
  # Linux distro compatibility matrix. The main test-linux-cpu job above
  # only exercises ubuntu-latest; this one runs the *same* CPU wheel
  # against a spread of real distros (different glibc versions, different
  # package managers) to catch glibc-edge and linker issues that
  # manylinux's static analysis cannot cover. Rocky 8 is particularly
  # important — its glibc 2.28 is the exact lower bound of the
  # manylinux_2_28 tag the wheel claims. Rocky 8's default python3 is 3.6
  # (below our >=3.9 requirement) so we install python39 as a fallback.
  test-linux-distros:
    name: Test Linux CPU wheel on ${{ matrix.distro }}
    needs: build-linux-cpu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - debian:11
          - rockylinux:8
          - rockylinux:9
          - fedora:40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - name: Test wheel in ${{ matrix.distro }} container
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e EXPECTED_VERSION \
            ${{ matrix.distro }} \
            bash -c '
              set -e
              # Install python >= 3.9 + pip via the distro package manager.
              if [ -f /etc/debian_version ]; then
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                    python3 python3-pip git ca-certificates
                PY=python3
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y -q git ca-certificates python3 python3-pip
                # Rocky 8 ships python3=3.6, too old for pysiglib. Install
                # python39 as a fallback and use python3.9 directly.
                if python3 -c "import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)"; then
                  PY=python3
                else
                  dnf install -y -q python39
                  PY=python3.9
                fi
              else
                echo "Unsupported distro: no apt-get or dnf" >&2
                exit 1
              fi
              $PY --version
              $PY -m pip install --quiet --upgrade pip
              $PY -m pip install --quiet /workspace/dist/*.whl pytest "jax>=0.9.1; python_version >= \"3.11\""
              # cd out of /workspace before any python invocation so imports
              # resolve `pysiglib` from site-packages (installed wheel) rather
              # than from the checked-out /workspace/pysiglib/ source tree.
              cd /tmp
              $PY -c "import os, pysiglib; expected=os.environ[\"EXPECTED_VERSION\"]; actual=pysiglib.__version__; assert actual==expected, \"Version mismatch: built wheel reports \"+actual+\", workflow input expected \"+expected; print(\"Version verified:\", actual)"
              $PY -m pytest /workspace/tests/ -v
            '

  # ============================================================
  # Single manual-approval gate for all GPU tests. Every CUDA test job below
  # declares `needs: gate-cuda-tests`, so the `deployment` environment
  # protection rule triggers exactly once per workflow run — the user
  # approves GPU tests as a group at the start of the run, not once per
  # CUDA wheel. Adding a new CUDA test job requires no new approvals.
  gate-cuda-tests:
    name: Approve GPU tests
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    environment: deployment
    runs-on: ubuntu-latest
    steps:
      - run: echo "GPU tests approved - proceeding on the self-hosted runner."

  # Both CUDA test jobs run on the self-hosted Windows runner (Docker +
  # WSL2 + NVIDIA driver). Linux tests go through an ephemeral --rm
  # container; Windows tests run directly on the host. Security relies on:
  # workflow_dispatch trigger only, canonical-repo actor check below,
  # gate-cuda-tests for manual approval, and Docker's --rm for Linux.
  test-linux-cuda:
    name: Test Linux CUDA wheel (GPU)
    needs:
      - build-linux-cpu
      - build-linux-cuda
      - gate-cuda-tests
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        # -ExecutionPolicy Bypass: default Restricted policy on self-hosted
        # Windows refuses to source GHA's generated .ps1 wrappers.
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      # Both the base pysiglib wheel (cpsig + CPU JAX FFI) and the
      # pysiglib-cuda plugin (cusig + CUDA JAX FFI) must be installed. The
      # wheel is then downloaded into the same `dist/` directory so a single
      # `pip install dist/*.whl` inside the test container picks up both.
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cuda
          path: dist
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull test image
        run: docker pull ${{ env.TEST_CUDA_IMAGE }}
      - name: Pull CUDA build image
        run: docker pull ${{ env.MANYLINUX_CUDA_IMAGE }}
      - name: Run pytest in ephemeral test container with --gpus all
        # PowerShell writes a bash script as LF-only BOM-less UTF-8 so the
        # Linux container can parse it. pytest-timeout guards against hung
        # kernels. EXPECTED_VERSION is forwarded in via `docker run -e`.
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $scriptBody = @'
          set -e
          python3 -c "import sys; assert sys.version_info >= (3, 11), 'CUDA JAX tests require Python >=3.11'; print('python:', sys.version)"
          python3 -m pip install --quiet /workspace/dist/*.whl 'jax[cuda12]>=0.9.1; python_version >= "3.11"'
          python3 -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
          nvidia-smi
          python3 -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
          python3 -c "import pysiglib; assert pysiglib.load_siglib.BUILT_WITH_CUDA, 'pysiglib-cuda installed but CUDA backend disabled'; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
          python3 -c "import importlib.metadata as metadata, jax; devices=jax.devices(); print('jax:', metadata.version('jax')); print('jaxlib:', metadata.version('jaxlib')); print('jax backend:', jax.default_backend()); print('jax devices:', devices); assert any(device.platform in {'gpu', 'cuda'} for device in devices), 'JAX CUDA device unavailable'"
          pytest /workspace/tests/ -v --timeout=60
          '@
          $ws = $env:GITHUB_WORKSPACE
          $scriptPath = Join-Path $ws "run-cuda-tests.sh"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($scriptPath, $scriptBody.Replace("`r`n", "`n"), $utf8NoBom)
          docker run --rm --gpus all `
            -v "${ws}:/workspace" `
            -w /tmp `
            -e EXPECTED_VERSION="$env:EXPECTED_VERSION" `
            -e PYSIGLIB_REQUIRE_CUDA=1 `
            ${{ env.TEST_CUDA_IMAGE }} `
            bash /workspace/run-cuda-tests.sh
      - name: Run CUDA C++ tests in build container
        run: |
          $scriptBody = @'
          set -e
          cmake -S /workspace/plugins/cuda -B /workspace/build_cuda_cpp_tests -DPYSIGLIB_TESTS=ON -DPYSIGLIB_CUDA_ARCH="${CUDA_ARCH}" -DCMAKE_BUILD_TYPE=Release
          cmake --build /workspace/build_cuda_cpp_tests --target cusig_tests --config Release --parallel 4
          ctest --test-dir /workspace/build_cuda_cpp_tests --output-on-failure -C Release -L cuda
          '@
          $ws = $env:GITHUB_WORKSPACE
          $scriptPath = Join-Path $ws "run-cuda-cpp-tests.sh"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($scriptPath, $scriptBody.Replace("`r`n", "`n"), $utf8NoBom)
          docker run --rm --gpus all `
            -v "${ws}:/workspace" `
            -w /workspace `
            -e CUDA_ARCH="$env:CUDA_ARCH" `
            ${{ env.MANYLINUX_CUDA_IMAGE }} `
            bash /workspace/run-cuda-cpp-tests.sh

  test-windows-cuda:
    name: Test Windows CUDA wheel
    needs:
      - build-windows-cpu
      - build-windows-cuda
      - gate-cuda-tests
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      # Uses the runner's system Python 3.13 (setup-python on this runner
      # produces a broken tool-cache install). Both wheels (base CPU + CUDA
      # plugin) must be installed; see test-linux-cuda for the same pattern.
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cuda
          path: dist
      # The CUDA C++ tests build from source on this GPU runner, so make sure
      # nvcc and the Visual Studio CUDA integration are available here too.
      - name: Cache CUDA toolkit
        id: cuda-cache
        uses: actions/cache@v5
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9
            C:\Program Files\Microsoft Visual Studio\2022\*\MSBuild\Microsoft\VC\v170\BuildCustomizations
          key: cuda-win-selfhosted-${{ runner.name }}-12.9.1-nvcc-cudart-thrust-vsint-v1
      - name: Install CUDA toolkit
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "thrust", "visual_studio_integration"]'
      - name: Expose CUDA env on cache hit
        if: steps.cuda-cache.outputs.cache-hit == 'true'
        run: |
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          "CUDA_PATH=$root"        | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_PATH_V12_9=$root"  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_HOME=$root"        | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$root\bin"              | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$root\libnvvp"          | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Verify nvcc
        run: nvcc --version
      # Ephemeral per-run venv isolates this job from leftover state on the
      # self-hosted runner (stale installs, pytest plugins, Python 3.12/3.13
      # site-packages drift). Prepending Scripts\ to GITHUB_PATH makes all
      # subsequent python/pip/pytest calls resolve through the venv.
      - name: Create ephemeral venv
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "venv-$env:GITHUB_RUN_ID"
          if (Test-Path $venv) { Remove-Item -Recurse -Force $venv }
          python -m venv $venv
          "$venv\Scripts" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PYSIGLIB_TEST_VENV=$venv" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "venv: $venv"
      - name: Install wheels + test deps
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Checked {
            param([scriptblock]$Command)
            & $Command
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          function Invoke-WithRetry {
            param([scriptblock]$Command, [string]$Name)
            for ($i = 1; $i -le 5; $i++) {
              & $Command
              if ($LASTEXITCODE -eq 0) { return }
              if ($i -eq 5) { exit $LASTEXITCODE }
              Write-Host "$Name failed (attempt $i), retrying in 15s..."
              Start-Sleep -Seconds 15
            }
          }

          Invoke-Checked { python -m pip install --upgrade pip }
          Invoke-WithRetry { python -m pip install torch --index-url $env:PYTORCH_CUDA_INDEX } "CUDA torch install"
          Invoke-Checked { python -c "import torch; assert torch.cuda.is_available(), 'torch CUDA unavailable after CUDA index install'; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0))" }
          Get-ChildItem dist\*.whl | ForEach-Object {
            $wheel = $_.FullName
            Invoke-Checked { python -m pip install $wheel }
          }
          Invoke-Checked { python -m pip install pytest pytest-timeout }
          $needs_jax = & python -c "import sys; print('yes' if sys.version_info >= (3,11) else 'no')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($needs_jax.Trim() -eq 'yes') { Invoke-Checked { python -m pip install 'jax>=0.9.1' } }
      - name: Verify installed version matches input
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Verify GPU + CUDA visibility
        working-directory: ${{ runner.temp }}
        run: |
          nvidia-smi
          python -c "import torch; assert torch.cuda.is_available(), 'torch CUDA unavailable'; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"
          python -c "import pysiglib; assert pysiglib.load_siglib.BUILT_WITH_CUDA, 'pysiglib-cuda installed but CUDA backend disabled'; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
      - name: Run full test suite
        working-directory: ${{ runner.temp }}
        env:
          PYSIGLIB_REQUIRE_CUDA: "1"
        run: python -m pytest ${{ github.workspace }}/tests/ -v --timeout=60
      - name: Run CUDA C++ tests
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE "plugins/cuda"
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build_cuda_cpp_tests"
          cmake -S $sourceDir -B $buildDir -DPYSIGLIB_TESTS=ON "-DPYSIGLIB_CUDA_ARCH=$env:CUDA_ARCH" -DCMAKE_BUILD_TYPE=Release
          cmake --build $buildDir --target cusig_tests --config Release --parallel 4
          ctest --test-dir $buildDir --output-on-failure -C Release -L cuda
      - name: Remove ephemeral venv
        if: always()
        run: |
          if ($env:PYSIGLIB_TEST_VENV -and (Test-Path $env:PYSIGLIB_TEST_VENV)) {
            Remove-Item -Recurse -Force $env:PYSIGLIB_TEST_VENV
          }
  test-windows-cpu:
    name: Test Windows CPU wheel (py${{ matrix.python-version }})
    needs: build-windows-cpu
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - name: Install wheel + test deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          Get-ChildItem dist\*.whl | ForEach-Object { pip install $_.FullName }
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      - name: Verify installed version matches input
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Run CPU test suite
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
      - name: Run C++ CPU tests
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          cmake -S . -B build_cpp_tests -DPYSIGLIB_TESTS=ON -DPYSIGLIB_BENCHMARKS=OFF -DPYSIGLIB_JAX_FFI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build_cpp_tests --target cpsig_tests --config Release --parallel 4
          ctest --test-dir build_cpp_tests --output-on-failure -C Release
  test-macos:
    name: Test macOS wheel (py${{ matrix.python-version }})
    needs: build-macos
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos
          path: dist
      - name: Install wheel + test deps
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      - name: Verify installed version matches input
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Run CPU test suite
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
      - name: Run C++ CPU tests
        if: matrix.python-version == '3.13'
        run: |
          cmake -S . -B build_cpp_tests -DPYSIGLIB_TESTS=ON -DPYSIGLIB_BENCHMARKS=OFF -DPYSIGLIB_JAX_FFI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build_cpp_tests --target cpsig_tests --config Release --parallel 4
          ctest --test-dir build_cpp_tests --output-on-failure -C Release
  # ============================================================
  # Aggregate all built wheels into one downloadable artifact.
  # Gated on every test job so the `all-wheels` artifact is only produced
  # for a release bundle that actually passed its tests. GPU tests are
  # allowed to be `skipped` (when the user dispatches with
  # run_gpu_tests=false) thanks to `!failure() && !cancelled()`, but any
  # actual test FAILURE blocks the collect step and every publish job
  # downstream.
  # ============================================================
  collect-wheels:
    name: Collect all wheels
    needs:
      - build-linux-cpu
      - build-linux-cuda
      - build-windows-cpu
      - build-windows-cuda
      - build-macos
      - test-linux-cpu
      - test-linux-distros
      - test-windows-cpu
      - test-macos
      - test-linux-cuda
      - test-windows-cuda
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List collected wheels
        run: |
          ls -la dist/
          echo ""
          for f in dist/*.whl; do
            size=$(du -h "$f" | cut -f1)
            echo "$size  $(basename "$f")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: dist/*.whl

  # Manual approval gate before TestPyPI publish. Single approval unblocks
  # both publish-testpypi-cpu and publish-testpypi-cuda.
  approve-testpypi-publish:
    name: Approve TestPyPI publish
    needs:
      - collect-wheels
    if: ${{ inputs.publish_to_pypi }}
    environment: deployment
    runs-on: ubuntu-latest
    steps:
      - run: echo "TestPyPI publish approved - proceeding."

  publish-testpypi-cpu:
    name: Publish pysiglib to TestPyPI
    needs:
      - approve-testpypi-publish
      - collect-wheels  # transitively requires all CPU + (optional) GPU tests
    if: ${{ inputs.publish_to_pypi }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pysiglib/
    permissions:
      id-token: write  # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # Skipped on CPU-only releases (run_gpu_tests=false) so the base package
  # still publishes.
  publish-testpypi-cuda:
    name: Publish pysiglib-cuda to TestPyPI
    needs:
      - approve-testpypi-publish
      - collect-wheels  # transitively requires GPU tests to have passed
    if: ${{ inputs.publish_to_pypi && inputs.run_gpu_tests }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pysiglib-cuda/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cuda
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cuda
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # Fresh-install smoke tests pulling from TestPyPI. --extra-index-url on
  # PyPI for transitive deps; retry loop absorbs TestPyPI propagation delay.
  test-from-testpypi-linux:
    name: Test TestPyPI install on Linux (py${{ matrix.python-version }})
    needs: publish-testpypi-cpu
    if: ${{ inputs.publish_to_pypi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from TestPyPI
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          pip install --upgrade pip
          installed=0
          for i in 1 2 3 4 5; do
            if pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "pysiglib==${EXPECTED_VERSION}"; then
              installed=1; break
            fi
            echo "TestPyPI install failed (attempt $i), retrying in 15s..."
            sleep 15
          done
          [ "$installed" = 1 ] || { echo "TestPyPI install failed after 5 attempts"; exit 1; }
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      - name: Verify installed version
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
      - name: Run test suite
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
  test-from-testpypi-windows:
    name: Test TestPyPI install on Windows (py${{ matrix.python-version }})
    needs: publish-testpypi-cpu
    if: ${{ inputs.publish_to_pypi }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from TestPyPI
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --upgrade pip
          $installed = $false
          for ($i = 1; $i -le 5; $i++) {
            pip install --index-url https://test.pypi.org/simple/ `
                        --extra-index-url https://pypi.org/simple/ `
                        "pysiglib==$env:EXPECTED_VERSION"
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            Write-Host "TestPyPI install failed (attempt $i), retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          if (-not $installed) { Write-Error "TestPyPI install failed after 5 attempts"; exit 1 }
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      - name: Verify installed version
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
      - name: Run test suite
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
  test-from-testpypi-macos:
    name: Test TestPyPI install on macOS (py${{ matrix.python-version }})
    needs: publish-testpypi-cpu
    if: ${{ inputs.publish_to_pypi }}
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from TestPyPI
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --upgrade pip
          installed=0
          for i in 1 2 3 4 5; do
            if pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "pysiglib==${EXPECTED_VERSION}"; then
              installed=1; break
            fi
            echo "TestPyPI install failed (attempt $i), retrying in 15s..."
            sleep 15
          done
          [ "$installed" = 1 ] || { echo "TestPyPI install failed after 5 attempts"; exit 1; }
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      - name: Verify installed version
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
      - name: Run test suite
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v

  # Fresh-install GPU smoke tests: `pip install pysiglib-cuda` from TestPyPI
  # transitively pulls pysiglib (base), round-tripping both wheels through
  # the index before the production publish. Shares gate-cuda-tests so no
  # second approval prompt mid-run.
  test-from-testpypi-cuda-linux:
    name: Test TestPyPI install (Linux CUDA)
    needs:
      - publish-testpypi-cpu
      - publish-testpypi-cuda
      - gate-cuda-tests
    if: ${{ inputs.publish_to_pypi && inputs.run_gpu_tests }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull test image
        run: docker pull ${{ env.TEST_CUDA_IMAGE }}
      - name: Run pytest in ephemeral test container (install from TestPyPI)
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $scriptBody = @'
          set -e
          python3 -c "import sys; assert sys.version_info >= (3, 11), 'CUDA JAX tests require Python >=3.11'; print('python:', sys.version)"
          # Retry TestPyPI install to absorb propagation delay. Real PyPI
          # is used as a fallback index for torch/numpy/jax transitive deps.
          installed=0
          for i in 1 2 3 4 5; do
            if python3 -m pip install --quiet \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "pysiglib-cuda==${EXPECTED_VERSION}"; then
              installed=1; break
            fi
            echo "TestPyPI install failed (attempt $i), retrying in 15s..."
            sleep 15
          done
          [ "$installed" = 1 ] || { echo "TestPyPI install failed after 5 attempts"; exit 1; }
          python3 -m pip install --quiet 'jax[cuda12]>=0.9.1; python_version >= "3.11"'
          cd /tmp
          python3 -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
          nvidia-smi
          python3 -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
          python3 -c "import pysiglib; assert pysiglib.load_siglib.BUILT_WITH_CUDA, 'pysiglib-cuda installed but CUDA backend disabled'; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
          python3 -c "import importlib.metadata as metadata, jax; devices=jax.devices(); print('jax:', metadata.version('jax')); print('jaxlib:', metadata.version('jaxlib')); print('jax backend:', jax.default_backend()); print('jax devices:', devices); assert any(device.platform in {'gpu', 'cuda'} for device in devices), 'JAX CUDA device unavailable'"
          pytest /workspace/tests/ -v --timeout=60
          '@
          $ws = $env:GITHUB_WORKSPACE
          $scriptPath = Join-Path $ws "run-cuda-testpypi-tests.sh"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($scriptPath, $scriptBody.Replace("`r`n", "`n"), $utf8NoBom)
          docker run --rm --gpus all `
            -v "${ws}:/workspace" `
            -w /tmp `
            -e EXPECTED_VERSION="$env:EXPECTED_VERSION" `
            -e PYSIGLIB_REQUIRE_CUDA=1 `
            ${{ env.TEST_CUDA_IMAGE }} `
            bash /workspace/run-cuda-testpypi-tests.sh

  test-from-testpypi-cuda-windows:
    name: Test TestPyPI install (Windows CUDA)
    needs:
      - publish-testpypi-cpu
      - publish-testpypi-cuda
      - gate-cuda-tests
    if: ${{ inputs.publish_to_pypi && inputs.run_gpu_tests }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      # No actions/setup-python: see `test-windows-cuda` for rationale. Use
      # the system Python 3.13 that's first on PATH.
      # Per-run ephemeral venv, same pattern as `test-windows-cuda`.
      - name: Create ephemeral venv
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "venv-$env:GITHUB_RUN_ID"
          if (Test-Path $venv) { Remove-Item -Recurse -Force $venv }
          python -m venv $venv
          "$venv\Scripts" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PYSIGLIB_TEST_VENV=$venv" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "venv: $venv"
      - name: Install from TestPyPI + test deps
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Checked {
            param([scriptblock]$Command)
            & $Command
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          function Invoke-WithRetry {
            param([scriptblock]$Command, [string]$Name)
            for ($i = 1; $i -le 5; $i++) {
              & $Command
              if ($LASTEXITCODE -eq 0) { return }
              if ($i -eq 5) { exit $LASTEXITCODE }
              Write-Host "$Name failed (attempt $i), retrying in 15s..."
              Start-Sleep -Seconds 15
            }
          }

          Invoke-Checked { python -m pip install --upgrade pip }
          Invoke-WithRetry { python -m pip install torch --index-url $env:PYTORCH_CUDA_INDEX } "CUDA torch install"
          Invoke-Checked { python -c "import torch; assert torch.cuda.is_available(), 'torch CUDA unavailable after CUDA index install'; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0))" }
          $installed = $false
          for ($i = 1; $i -le 5; $i++) {
            python -m pip install --index-url https://test.pypi.org/simple/ `
                        --extra-index-url https://pypi.org/simple/ `
                        "pysiglib-cuda==$env:EXPECTED_VERSION"
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            Write-Host "TestPyPI install failed (attempt $i), retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          if (-not $installed) { Write-Error "TestPyPI install failed after 5 attempts"; exit 1 }
          Invoke-Checked { python -m pip install pytest pytest-timeout }
          $needs_jax = & python -c "import sys; print('yes' if sys.version_info >= (3,11) else 'no')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($needs_jax.Trim() -eq 'yes') { Invoke-Checked { python -m pip install 'jax>=0.9.1' } }
      - name: Verify installed version
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
      - name: Verify GPU + CUDA visibility
        working-directory: ${{ runner.temp }}
        run: |
          nvidia-smi
          python -c "import torch; assert torch.cuda.is_available(), 'torch CUDA unavailable'; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"
          python -c "import pysiglib; assert pysiglib.load_siglib.BUILT_WITH_CUDA, 'pysiglib-cuda installed but CUDA backend disabled'; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
      - name: Run full test suite
        working-directory: ${{ runner.temp }}
        env:
          PYSIGLIB_REQUIRE_CUDA: "1"
        run: python -m pytest ${{ github.workspace }}/tests/ -v --timeout=60
      - name: Remove ephemeral venv
        if: always()
        run: |
          if ($env:PYSIGLIB_TEST_VENV -and (Test-Path $env:PYSIGLIB_TEST_VENV)) {
            Remove-Item -Recurse -Force $env:PYSIGLIB_TEST_VENV
          }

  # Manual approval gate before production PyPI publish. Waits for every
  # TestPyPI install test (CPU + CUDA) to finish before prompting.
  # `!failure() && !cancelled()` lets CUDA tests be `skipped` when
  # run_gpu_tests=false without blocking a CPU-only release.
  approve-pypi-publish:
    name: Approve PyPI publish
    needs:
      - test-from-testpypi-linux
      - test-from-testpypi-windows
      - test-from-testpypi-macos
      - test-from-testpypi-cuda-linux
      - test-from-testpypi-cuda-windows
    if: ${{ always() && !failure() && !cancelled() && inputs.publish_to_pypi }}
    environment: deployment
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production PyPI publish approved - proceeding."

  publish-pypi-cpu:
    name: Publish pysiglib to PyPI
    needs:
      - approve-pypi-publish
      - test-from-testpypi-linux
      - test-from-testpypi-windows
      - test-from-testpypi-macos
    if: ${{ inputs.publish_to_pypi }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pysiglib/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # publish-pypi-cpu must land before the CUDA plugin so `pip install
  # pysiglib-cuda` can resolve the pinned `pysiglib` version from PyPI.
  publish-pypi-cuda:
    name: Publish pysiglib-cuda to PyPI
    needs:
      - approve-pypi-publish
      - test-from-testpypi-cuda-linux
      - test-from-testpypi-cuda-windows
      - publish-pypi-cpu
    if: ${{ inputs.publish_to_pypi && inputs.run_gpu_tests }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pysiglib-cuda/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cuda
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cuda
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
