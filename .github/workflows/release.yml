name: Release

# Builds pysiglib and pysiglib-cuda wheels, tests fresh installs across the
# supported platforms, and (optionally, gated by `publish_to_pypi`) publishes
# to TestPyPI, installs from TestPyPI and runs the test suite, then publishes
# to PyPI.
#
# Prerequisites before first run:
#   1. Run `build-cuda-images.yml` once to publish the manylinux build image
#      and CUDA test image to GHCR.
#   2. Register a self-hosted Windows runner with Docker Desktop + WSL2 + the
#      NVIDIA driver, labelled [self-hosted, Windows, X64].
#   3. To enable PyPI publishing (publish_to_pypi=true):
#      a. Configure Trusted Publishing on TestPyPI and PyPI for both the
#         `pysiglib` and `pysiglib-cuda12` projects. Each trusted publisher
#         entry must point at this repo, this workflow file, and the
#         environment name (`testpypi` / `pypi`).
#      b. Create two GitHub repo environments:
#         - `testpypi` (no required reviewers — auto-proceeds after tests pass)
#         - `pypi` (required reviewers = release approvers; holds the prod push
#           behind a manual gate after the TestPyPI install succeeds)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version you intend to release (asserted against pysiglib.__version__ in every test job — fails if the built wheels do not match).'
        type: string
        required: true
      run_gpu_tests:
        description: 'Run GPU test jobs on the self-hosted Windows runner.'
        type: boolean
        default: true
      publish_to_pypi:
        description: 'Publish to TestPyPI, run a fresh-install smoke test, then publish to PyPI. Requires Trusted Publishing + `testpypi` / `pypi` environments to be configured (see release.yml header).'
        type: boolean
        default: false

env:
  # Shared CUDA arch list for Linux and Windows plugin builds.
  CUDA_ARCH: "50;60;70;75;80;86;89;90;100;120"
  # Pre-built CUDA test image from build-cuda-images.yml.
  TEST_CUDA_IMAGE: ghcr.io/daniil-shmelev/pysiglib-test-cuda12:cuda-12.9.1

permissions:
  contents: read

jobs:
  # ============================================================
  # Linux CPU wheel
  # ============================================================
  build-linux-cpu:
    name: Build Linux CPU wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ENVIRONMENT: SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-cpu
          path: wheelhouse/*.whl

  # ============================================================
  # Linux CUDA wheel
  # ============================================================
  build-linux-cuda:
    name: Build Linux CUDA plugin wheel (pysiglib-cuda)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Compute image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/pysiglib-manylinux-cuda12:cuda-12.9.1" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pypa/cibuildwheel@v3.2
        with:
          package-dir: plugins/cuda
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ steps.image.outputs.name }}
          # Quote CUDA_ARCH so cibuildwheel keeps the semicolon-delimited list intact.
          CIBW_ENVIRONMENT: 'CUDA_ARCH="${{ env.CUDA_ARCH }}"'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-cuda
          path: wheelhouse/*.whl

  # ============================================================
  # Windows CPU wheel
  # ============================================================
  build-windows-cpu:
    name: Build Windows CPU wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ENVIRONMENT: SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-cpu
          path: wheelhouse/*.whl

  # ============================================================
  # Windows CUDA wheel
  # ============================================================
  build-windows-cuda:
    name: Build Windows CUDA plugin wheel (pysiglib-cuda)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # Cache the installed CUDA toolkit directory AND the Visual Studio
      # BuildCustomizations dir where Jimver's `visual_studio_integration`
      # sub-package drops CUDA's MSBuild .props / .targets files. Without
      # the VS files cached, a cache hit would skip Jimver entirely and the
      # next CMake configure would fail with "No CUDA toolset found" because
      # the VS generator can't locate the CUDA build rules.
      # Bump the key suffix if CUDA version, sub-packages, or paths change.
      - name: Cache CUDA toolkit
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9
            C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations
          key: cuda-win-12.9.1-nvcc-cudart-thrust-vsint-v2
      - name: Install CUDA toolkit
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        # Use Windows-native sub-package names; on Windows `cudart` already
        # includes the runtime libraries and headers.
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "thrust", "visual_studio_integration"]'
      - name: Expose CUDA env on cache hit
        if: steps.cuda-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          "CUDA_PATH=$root"        | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_PATH_V12_9=$root"  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_HOME=$root"        | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$root\bin"              | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$root\libnvvp"          | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Verify nvcc
        shell: pwsh
        run: nvcc --version
      - uses: pypa/cibuildwheel@v3.2
        with:
          package-dir: plugins/cuda
        env:
          # Quote CUDA_ARCH so cibuildwheel keeps the semicolon-delimited list intact.
          CIBW_ENVIRONMENT: 'CUDA_ARCH="${{ env.CUDA_ARCH }}"'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-cuda
          path: wheelhouse/*.whl

  # ============================================================
  # macOS wheel
  # ============================================================
  build-macos:
    name: Build macOS wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ENVIRONMENT: SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: wheelhouse/*.whl

  # ============================================================
  # Test jobs — install the built wheels in a fresh environment and
  # run the test suite. These validate both "the wheel installs cleanly"
  # and "the Python code continues to work end-to-end" across the minimum
  # (3.9) and latest (3.13) Python versions we support.
  # ============================================================

  test-linux-cpu:
    name: Test Linux CPU wheel (py${{ matrix.python-version }})
    needs: build-linux-cpu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - name: Install wheel + test deps
        run: |
          pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      # The next two steps run from runner.temp so `import pysiglib` resolves
      # to the installed wheel in site-packages instead of the checked-out
      # source tree (which lacks the generated _config.py and native libs).
      - name: Verify installed version matches input
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Run test suite
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
  # ============================================================
  # Linux distro compatibility matrix. The main test-linux-cpu job above
  # only exercises ubuntu-latest; this one runs the *same* CPU wheel
  # against a spread of real distros (different glibc versions, different
  # package managers) to catch glibc-edge and linker issues that
  # manylinux's static analysis cannot cover. Rocky 8 is particularly
  # important — its glibc 2.28 is the exact lower bound of the
  # manylinux_2_28 tag the wheel claims. Rocky 8's default python3 is 3.6
  # (below our >=3.9 requirement) so we install python39 as a fallback.
  test-linux-distros:
    name: Test Linux CPU wheel on ${{ matrix.distro }}
    needs: build-linux-cpu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - debian:11
          - rockylinux:8
          - rockylinux:9
          - fedora:40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - name: Test wheel in ${{ matrix.distro }} container
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e EXPECTED_VERSION \
            ${{ matrix.distro }} \
            bash -c '
              set -e
              # Install python >= 3.9 + pip via the distro package manager.
              if [ -f /etc/debian_version ]; then
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                    python3 python3-pip git ca-certificates
                PY=python3
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y -q git ca-certificates python3 python3-pip
                # Rocky 8 ships python3=3.6, too old for pysiglib. Install
                # python39 as a fallback and use python3.9 directly.
                if python3 -c "import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)"; then
                  PY=python3
                else
                  dnf install -y -q python39
                  PY=python3.9
                fi
              else
                echo "Unsupported distro: no apt-get or dnf" >&2
                exit 1
              fi
              $PY --version
              $PY -m pip install --quiet --upgrade pip
              $PY -m pip install --quiet /workspace/dist/*.whl pytest "jax>=0.9.1; python_version >= \"3.11\""
              # cd out of /workspace before any python invocation so imports
              # resolve `pysiglib` from site-packages (installed wheel) rather
              # than from the checked-out /workspace/pysiglib/ source tree.
              cd /tmp
              $PY -c "import os, pysiglib; expected=os.environ[\"EXPECTED_VERSION\"]; actual=pysiglib.__version__; assert actual==expected, \"Version mismatch: built wheel reports \"+actual+\", workflow input expected \"+expected; print(\"Version verified:\", actual)"
              $PY -m pytest /workspace/tests/ -v
            '

  # ============================================================
  # Single manual-approval gate for all GPU tests. Every CUDA test job below
  # declares `needs: gate-cuda-tests`, so the `deployment` environment
  # protection rule triggers exactly once per workflow run — the user
  # approves GPU tests as a group at the start of the run, not once per
  # CUDA wheel. Adding a new CUDA test job requires no new approvals.
  gate-cuda-tests:
    name: Approve GPU tests
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    environment: deployment
    runs-on: ubuntu-latest
    steps:
      - run: echo "GPU tests approved - proceeding on the self-hosted runner."

  # ============================================================
  # test-linux-cuda and test-windows-cuda both run on the SELF-HOSTED Windows
  # runner. That runner has Docker Desktop + WSL2 + the NVIDIA driver, so a
  # Linux container started with --gpus all can reach the host's RTX 4060;
  # Windows-native tests (test-windows-cuda) exec directly against the host
  # GPU because the Windows CUDA wheel already bundles cudart via delvewheel.
  #
  # The Linux test image is pre-built by build-test-image.yml and pushed to
  # ghcr.io with torch + pytest baked in, so test-linux-cuda only needs to
  # `pip install` the wheel under test (~seconds) instead of redownloading
  # ~2 GB of torch on every run.
  #
  # Security model (applies to both CUDA test jobs below):
  #   1. release.yml only triggers on workflow_dispatch (no PR trigger), so
  #      fork PRs structurally cannot fire these jobs.
  #   2. The actor check below restricts execution to manual triggers from
  #      the canonical repo.
  #   3. The upstream gate-cuda-tests job routes through the `deployment`
  #      environment for a single manual approval that authorizes every
  #      CUDA test job in the run.
  #   4. test-linux-cuda runs inside an ephemeral Docker container destroyed
  #      with --rm, so any code that does run cannot persist on the host or
  #      read host files outside the workspace mount. test-windows-cuda
  #      cannot use the same container trick because the wheel is Windows
  #      native, so it relies on items 1-3 above plus the canonical-repo
  #      actor check for isolation.
  test-linux-cuda:
    name: Test Linux CUDA wheel (GPU)
    needs:
      - build-linux-cpu
      - build-linux-cuda
      - gate-cuda-tests
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        # Windows PowerShell 5.1 on self-hosted runners defaults to the
        # 'Restricted' execution policy, which refuses to source GHA's
        # generated .ps1 wrapper scripts. Add -ExecutionPolicy Bypass so
        # workflows run on a fresh runner without the user having to modify
        # the host's execution policy (which would also be a global change
        # affecting other software on the machine).
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      # Both the base pysiglib wheel (contains cpsig + CPU JAX FFI) and the
      # pysiglib-cuda plugin wheel (contains cusig) must be installed for
      # CUDA tests to run. The base wheel is downloaded first; the plugin
      # wheel is then downloaded into the same `dist/` directory so a single
      # `pip install dist/*.whl` inside the test container picks up both.
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cuda
          path: dist
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull test image
        run: docker pull ${{ env.TEST_CUDA_IMAGE }}
      - name: Run pytest in ephemeral test container with --gpus all
        # pytest-timeout kills any single test that runs longer than 60s, so
        # a hung kernel cannot consume the whole job budget. The self-hosted
        # Windows runner has no bash installed (C:\Windows\System32\bash.exe
        # dispatches to WSL, which isn't set up), so the step runs in
        # powershell. The test script is written to the workspace as LF-only,
        # BOM-less UTF-8 so the Linux container's bash can parse it cleanly.
        # EXPECTED_VERSION is forwarded into the container via -e so the
        # version-check line inside the bash script can read it.
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $scriptBody = @'
          set -e
          # kauri 2.1.1 is an sdist on PyPI (no wheel); the baked-in pip in
          # the test container is too old to build it, so upgrade first.
          python3 -m pip install --quiet --upgrade pip setuptools wheel
          python3 -m pip install --quiet /workspace/dist/*.whl 'jax>=0.9.1; python_version >= "3.11"'
          python3 -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
          nvidia-smi
          python3 -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
          python3 -c "import pysiglib; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
          pytest /workspace/tests/ -v --timeout=60
          '@
          $ws = $env:GITHUB_WORKSPACE
          $scriptPath = Join-Path $ws "run-cuda-tests.sh"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($scriptPath, $scriptBody.Replace("`r`n", "`n"), $utf8NoBom)
          docker run --rm --gpus all `
            -v "${ws}:/workspace" `
            -w /tmp `
            -e EXPECTED_VERSION="$env:EXPECTED_VERSION" `
            ${{ env.TEST_CUDA_IMAGE }} `
            bash /workspace/run-cuda-tests.sh

  test-windows-cuda:
    name: Test Windows CUDA wheel
    needs:
      - build-windows-cpu
      - build-windows-cuda
      - gate-cuda-tests
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        # Same Restricted-execution-policy override as test-linux-cuda;
        # needed because Windows PowerShell 5.1 on the self-hosted runner
        # otherwise refuses to source GHA's generated .ps1 wrapper.
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      # No actions/setup-python: setup-python's Windows installer conflicts
      # with the runner's pre-existing Python 3.13 and produces a broken
      # tool-cache install (missing Lib). Use the system Python 3.13 at
      # `C:\Users\Shmelev\AppData\Local\Programs\Python\Python313\` instead
      # - it's first on PATH. The Python-version matrix is redundant here:
      # the py3-none-win_amd64 wheel is universal across Python 3.x, and
      # py3.9 coverage is already exercised by `test-windows-cpu` on the
      # hosted runner.
      # Both the base pysiglib wheel (cpsig + CPU JAX FFI) and the
      # pysiglib-cuda plugin wheel (cusig) must be installed.
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cuda
          path: dist
      - name: Install wheels + test deps
        run: |
          # Use `python -m pip` throughout so pip and subsequent `python -c`
          # calls run in the same interpreter. The Python-version marker
          # cannot be quoted through the nested PowerShell, so gate on the
          # major version in PowerShell and pass jax without a marker.
          python -m pip install --upgrade pip
          Get-ChildItem dist\*.whl | ForEach-Object { python -m pip install $_.FullName }
          python -m pip install pytest pytest-timeout torch
          $needs_jax = & python -c "import sys; print('yes' if sys.version_info >= (3,11) else 'no')"
          if ($needs_jax.Trim() -eq 'yes') { python -m pip install 'jax>=0.9.1' }
      # The next three steps run from runner.temp so `import pysiglib` resolves
      # to the installed wheel in site-packages instead of the checked-out
      # source tree (which lacks the generated _config.py and native libs).
      - name: Verify installed version matches input
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Verify GPU + CUDA visibility
        working-directory: ${{ runner.temp }}
        run: |
          nvidia-smi
          python -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
          python -c "import pysiglib; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
      - name: Run full test suite
        working-directory: ${{ runner.temp }}
        # `python -m pytest` rather than bare `pytest.exe`, because the
        # self-hosted runner has multiple Python installs and the first
        # pytest.exe on PATH may belong to a different interpreter than the
        # one where the wheel was installed.
        run: python -m pytest ${{ github.workspace }}/tests/ -v --timeout=60
  test-windows-cpu:
    name: Test Windows CPU wheel (py${{ matrix.python-version }})
    needs: build-windows-cpu
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - name: Install wheel + test deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          Get-ChildItem dist\*.whl | ForEach-Object { pip install $_.FullName }
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      # The next two steps run from runner.temp so `import pysiglib` resolves
      # to the installed wheel, not the checked-out source tree.
      - name: Verify installed version matches input
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Run CPU test suite
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
  test-macos:
    name: Test macOS wheel (py${{ matrix.python-version }})
    needs: build-macos
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos
          path: dist
      - name: Install wheel + test deps
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      # The next two steps run from runner.temp so `import pysiglib` resolves
      # to the installed wheel, not the checked-out source tree.
      - name: Verify installed version matches input
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: built wheel reports '+actual+', workflow input expected '+expected; print('Version verified:', actual)"
      - name: Run CPU test suite
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
  # ============================================================
  # Aggregate all built wheels into one downloadable artifact.
  # Gated on every test job so the `all-wheels` artifact is only produced
  # for a release bundle that actually passed its tests. GPU tests are
  # allowed to be `skipped` (when the user dispatches with
  # run_gpu_tests=false) thanks to `!failure() && !cancelled()`, but any
  # actual test FAILURE blocks the collect step and every publish job
  # downstream.
  # ============================================================
  collect-wheels:
    name: Collect all wheels
    needs:
      - build-linux-cpu
      - build-linux-cuda
      - build-windows-cpu
      - build-windows-cuda
      - build-macos
      - test-linux-cpu
      - test-linux-distros
      - test-windows-cpu
      - test-macos
      - test-linux-cuda
      - test-windows-cuda
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List collected wheels
        run: |
          ls -la dist/
          echo ""
          for f in dist/*.whl; do
            size=$(du -h "$f" | cut -f1)
            echo "$size  $(basename "$f")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: dist/*.whl

  # ============================================================
  # TestPyPI publish — CPU wheels.
  # Deploys pysiglib (base) wheels to test.pypi.org. All CPU test jobs must
  # have passed first. Uses OIDC Trusted Publishing; the `testpypi` environment
  # has no required reviewers, so this proceeds automatically once the tests
  # are green.
  # ============================================================
  publish-testpypi-cpu:
    name: Publish pysiglib to TestPyPI
    needs:
      - collect-wheels  # transitively requires all CPU + (optional) GPU tests
    if: ${{ inputs.publish_to_pypi }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pysiglib/
    permissions:
      id-token: write  # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # ============================================================
  # TestPyPI publish — CUDA plugin wheels.
  # Only runs if GPU tests were enabled (and therefore passed); skipped
  # otherwise so a CPU-only release cycle still publishes the base package.
  # ============================================================
  publish-testpypi-cuda:
    name: Publish pysiglib-cuda to TestPyPI
    needs:
      - collect-wheels  # transitively requires GPU tests to have passed
    if: ${{ inputs.publish_to_pypi && inputs.run_gpu_tests }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pysiglib-cuda12/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cuda
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cuda
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # ============================================================
  # Fresh-install smoke tests pulling pysiglib straight from TestPyPI.
  # TestPyPI does not mirror all transitive dependencies, so we pass
  # --extra-index-url pointing at real PyPI so numpy/torch/jax resolve.
  # A short retry loop absorbs TestPyPI's occasional propagation delay.
  # ============================================================
  test-from-testpypi-linux:
    name: Test TestPyPI install on Linux (py${{ matrix.python-version }})
    needs: publish-testpypi-cpu
    if: ${{ inputs.publish_to_pypi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from TestPyPI
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          pip install --upgrade pip
          for i in 1 2 3 4 5; do
            if pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "pysiglib==${EXPECTED_VERSION}"; then
              break
            fi
            echo "TestPyPI install failed (attempt $i), retrying in 15s..."
            sleep 15
          done
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      - name: Verify installed version
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
      - name: Run test suite
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
  test-from-testpypi-windows:
    name: Test TestPyPI install on Windows (py${{ matrix.python-version }})
    needs: publish-testpypi-cpu
    if: ${{ inputs.publish_to_pypi }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from TestPyPI
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --upgrade pip
          for ($i = 1; $i -le 5; $i++) {
            pip install --index-url https://test.pypi.org/simple/ `
                        --extra-index-url https://pypi.org/simple/ `
                        "pysiglib==$env:EXPECTED_VERSION"
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "TestPyPI install failed (attempt $i), retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      - name: Verify installed version
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
      - name: Run test suite
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v
  test-from-testpypi-macos:
    name: Test TestPyPI install on macOS (py${{ matrix.python-version }})
    needs: publish-testpypi-cpu
    if: ${{ inputs.publish_to_pypi }}
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from TestPyPI
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --upgrade pip
          for i in 1 2 3 4 5; do
            if pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "pysiglib==${EXPECTED_VERSION}"; then
              break
            fi
            echo "TestPyPI install failed (attempt $i), retrying in 15s..."
            sleep 15
          done
          pip install pytest 'jax>=0.9.1; python_version >= "3.11"'
      - name: Verify installed version
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
      - name: Run test suite
        working-directory: ${{ runner.temp }}
        run: pytest ${{ github.workspace }}/tests/ -v

  # ============================================================
  # Fresh-install GPU smoke tests pulling pysiglib-cuda from TestPyPI.
  # Runs on the same self-hosted runner as the local-wheel GPU tests,
  # gated by the shared `gate-cuda-tests` approval so there's no second
  # prompt mid-run. Installing pysiglib-cuda from TestPyPI transitively
  # pulls in pysiglib (base) from TestPyPI, so this round-trips both
  # wheels through the index before the production publish.
  # ============================================================
  test-from-testpypi-cuda-linux:
    name: Test TestPyPI install (Linux CUDA)
    needs:
      - publish-testpypi-cpu
      - publish-testpypi-cuda
      - gate-cuda-tests
    if: ${{ inputs.publish_to_pypi && inputs.run_gpu_tests }}
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull test image
        run: docker pull ${{ env.TEST_CUDA_IMAGE }}
      - name: Run pytest in ephemeral test container (install from TestPyPI)
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $scriptBody = @'
          set -e
          # kauri 2.1.1 is an sdist on PyPI (no wheel); the baked-in pip in
          # the test container is too old to build it, so upgrade first.
          python3 -m pip install --quiet --upgrade pip setuptools wheel
          # Retry TestPyPI install to absorb propagation delay. Real PyPI
          # is used as a fallback index for torch/numpy/jax transitive deps.
          for i in 1 2 3 4 5; do
            if python3 -m pip install --quiet \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "pysiglib-cuda==${EXPECTED_VERSION}"; then
              break
            fi
            echo "TestPyPI install failed (attempt $i), retrying in 15s..."
            sleep 15
          done
          cd /tmp
          python3 -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
          nvidia-smi
          python3 -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
          python3 -c "import pysiglib; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
          pytest /workspace/tests/ -v --timeout=60
          '@
          $ws = $env:GITHUB_WORKSPACE
          $scriptPath = Join-Path $ws "run-cuda-testpypi-tests.sh"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($scriptPath, $scriptBody.Replace("`r`n", "`n"), $utf8NoBom)
          docker run --rm --gpus all `
            -v "${ws}:/workspace" `
            -w /tmp `
            -e EXPECTED_VERSION="$env:EXPECTED_VERSION" `
            ${{ env.TEST_CUDA_IMAGE }} `
            bash /workspace/run-cuda-testpypi-tests.sh

  test-from-testpypi-cuda-windows:
    name: Test TestPyPI install (Windows CUDA)
    needs:
      - publish-testpypi-cpu
      - publish-testpypi-cuda
      - gate-cuda-tests
    if: ${{ inputs.publish_to_pypi && inputs.run_gpu_tests }}
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      # No actions/setup-python: see `test-windows-cuda` for rationale. Use
      # the system Python 3.13 that's first on PATH.
      - name: Install from TestPyPI + test deps
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          # Use `python -m pip` throughout so pip and subsequent `python -c`
          # calls run in the same interpreter. The Python-version marker
          # cannot be quoted through the nested PowerShell, so gate on the
          # major version in PowerShell and pass jax without a marker.
          python -m pip install --upgrade pip
          for ($i = 1; $i -le 5; $i++) {
            python -m pip install --index-url https://test.pypi.org/simple/ `
                        --extra-index-url https://pypi.org/simple/ `
                        "pysiglib-cuda==$env:EXPECTED_VERSION"
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "TestPyPI install failed (attempt $i), retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          python -m pip install pytest pytest-timeout torch
          $needs_jax = & python -c "import sys; print('yes' if sys.version_info >= (3,11) else 'no')"
          if ($needs_jax.Trim() -eq 'yes') { python -m pip install 'jax>=0.9.1' }
      - name: Verify installed version
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, pysiglib; expected=os.environ['EXPECTED_VERSION']; actual=pysiglib.__version__; assert actual==expected, 'Version mismatch: '+actual+' vs '+expected; print('Version verified:', actual)"
      - name: Verify GPU + CUDA visibility
        working-directory: ${{ runner.temp }}
        run: |
          nvidia-smi
          python -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
          python -c "import pysiglib; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
      - name: Run full test suite
        working-directory: ${{ runner.temp }}
        # See note in test-windows-cuda about bare `pytest` vs `python -m pytest`.
        run: python -m pytest ${{ github.workspace }}/tests/ -v --timeout=60

  # ============================================================
  # Production PyPI publish - CPU wheels.
  # Gated by the `pypi` environment, which should require manual reviewer
  # approval. Runs only after the TestPyPI install tests pass on every OS,
  # so by this point we have high confidence the wheel installs cleanly.
  # ============================================================
  publish-pypi-cpu:
    name: Publish pysiglib to PyPI
    needs:
      - test-from-testpypi-linux
      - test-from-testpypi-windows
      - test-from-testpypi-macos
    if: ${{ inputs.publish_to_pypi }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pysiglib/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ============================================================
  # Production PyPI publish — CUDA plugin.
  # Gated by the fresh-install GPU tests (which transitively require the
  # TestPyPI CUDA publish) plus the base-package PyPI publish. The latter
  # ensures `pip install pysiglib-cuda12` from PyPI can pull a working
  # `pysiglib` at the same version.
  # ============================================================
  publish-pypi-cuda:
    name: Publish pysiglib-cuda to PyPI
    needs:
      - test-from-testpypi-cuda-linux
      - test-from-testpypi-cuda-windows
      - publish-pypi-cpu
    if: ${{ inputs.publish_to_pypi && inputs.run_gpu_tests }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pysiglib-cuda12/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cuda
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cuda
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
