name: Build CUDA test image

# Builds Dockerfile.test-cuda and pushes it to the GitHub Container Registry
# as ghcr.io/<owner>/pysiglib-test-cuda12. The wheels.yml `test-linux-cuda`
# job pulls the resulting image on every run so it doesn't have to redownload
# torch + apt packages inside an ephemeral nvidia/cuda container each time.
#
# Run this manually whenever the CUDA runtime base image or the pinned test
# dependencies (pytest, pytest-timeout, torch) need bumping.
#
# Prerequisites: none. The built-in GITHUB_TOKEN is authorized to push to
# ghcr.io/<owner>/* as long as the workflow declares packages: write. After
# the first push, make the package public via
# https://github.com/<owner>?tab=packages → pysiglib-test-cuda12 →
# Package settings → Change visibility → Public (so pulls from the self-hosted
# runner don't need ghcr.io credentials).

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA runtime image version (e.g. 12.9.1)'
        default: '12.9.1'
        required: true
      push_latest:
        description: 'Also tag as :latest'
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Gated by the `deployment` environment — any job that pushes externally
    # (ghcr.io, PyPI, TestPyPI) or spends paid resources routes through here.
    # Required reviewers on the environment enforce human approval before
    # the job can run, regardless of who triggered the workflow.
    environment: deployment
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/pysiglib-test-cuda12"
          TAGS="${IMAGE}:cuda-${{ github.event.inputs.cuda_version }}"
          if [ "${{ github.event.inputs.push_latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test-cuda
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ github.event.inputs.cuda_version }}
          cache-from: type=gha,scope=test-cuda12
          cache-to: type=gha,scope=test-cuda12,mode=max

      - name: Report image size
        run: |
          docker images ${{ steps.tags.outputs.image }} --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' || true
