name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA plugin and runs cusig_tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "siglib/cusig/**"
      - "siglib/cusig_unit_testing/**"
      - "siglib/shared/**"
      - "plugins/cuda/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cusig:
    name: cusig_tests on simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # library-path is false because cusig links the toolkit's cuBLAS; the
      # tests run under `vgpu run` instead.
      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ab71a07326835be678918901c340d53a83358067 # v0.1.6
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"
          library-path: 'false'

      # 90-virtual embeds PTX only, which the simulator runs (the default
      # `native` needs a real GPU at configure time). The simulator needs a
      # shared CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
            -DCUDAToolkit_ROOT=/usr/local/cuda-13.0 \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DPYSIGLIB_CUDA=ON \
            -DPYSIGLIB_TESTS=ON \
            -DPYSIGLIB_JAX_FFI=OFF \
            -DPYSIGLIB_CUDA_ARCH=90-virtual

      - name: Build
        run: cmake --build build --target cusig_tests -j3

      # The Pascal tests skip when no device is found, so fail the job if any
      # test is skipped: that would mean the simulated GPU was not used.
      - name: Test
        shell: bash
        working-directory: build/cusig_unit_testing
        run: |
          vgpu run --gpu nvidia/h100 ./cusig_tests 2>&1 | tee cusig_tests.log
          if grep -q '^\[  SKIPPED \]' cusig_tests.log; then
            echo "::error::Some tests were skipped (no GPU found)"
            exit 1
          fi
