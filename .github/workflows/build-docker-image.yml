name: Build manylinux+CUDA image

# Builds Dockerfile.manylinux-cuda12 and pushes it to the GitHub Container
# Registry as ghcr.io/<owner>/pysiglib-manylinux-cuda12. Run this manually
# whenever the base image or CUDA toolkit version bumps. The wheels.yml
# workflow pulls the resulting image for its CUDA Linux build job.
#
# Prerequisites: none. The built-in GITHUB_TOKEN is authorized to push to
# ghcr.io/<owner>/* as long as the workflow declares packages: write.
# After the first successful push, consider making the package public via
# https://github.com/<owner>?tab=packages → pysiglib-manylinux-cuda12 →
# Package settings → Change visibility → Public.

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA toolkit version (e.g. 12.9.1)'
        default: '12.9.1'
        required: true
      cuda_driver:
        description: 'CUDA driver version used to tag the runfile (e.g. 575.57.08)'
        default: '575.57.08'
        required: true
      push_latest:
        description: 'Also tag as :latest'
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Gated by the `deployment` environment — any job that pushes externally
    # (ghcr.io, PyPI, TestPyPI) or spends paid resources routes through here.
    # Required reviewers on the environment enforce human approval before
    # the job can run, regardless of who triggered the workflow.
    environment: deployment
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # GHA ubuntu-latest runners ship with ~14 GB free disk. The CUDA 12.9
      # runfile is ~4.5 GB and installs to ~6 GB, so we aggressively free
      # space before the build to avoid running out mid-install.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/pysiglib-manylinux-cuda12"
          TAGS="${IMAGE}:cuda-${{ github.event.inputs.cuda_version }}"
          if [ "${{ github.event.inputs.push_latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.manylinux-cuda12
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ github.event.inputs.cuda_version }}
            CUDA_DRIVER=${{ github.event.inputs.cuda_driver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          docker images ${{ steps.tags.outputs.image }} --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' || true
