name: Wheels

# Build pysiglib wheels for all supported platforms (CPU + CUDA on Linux/Windows,
# CPU-only on macOS), then test each wheel against a fresh install on every
# target platform + Python version. Does not upload to PyPI — that's a future
# workflow gated by environment protection rules.
#
# Manual trigger only (workflow_dispatch). You can run it from the Actions tab
# or via: gh workflow run wheels.yml --ref <branch>
#
# Cost: all jobs run on GHA's free runners or the self-hosted Windows runner.
# No paid GPU resources are involved.
#
# Prerequisites before first run:
#   1. Run `build-docker-image.yml` once to publish the manylinux+CUDA build
#      image to ghcr.io/<owner>/pysiglib-manylinux-cuda12:cuda-12.9.1 (used by
#      the build-linux-cuda wheel build job).
#   2. Run `build-test-image.yml` once to publish the CUDA test image to
#      ghcr.io/<owner>/pysiglib-test-cuda12:cuda-12.9.1 (used by test-linux-cuda
#      to avoid re-downloading torch on every run).
#   3. Register a self-hosted Windows runner with Docker Desktop + WSL2 + the
#      NVIDIA driver, labelled [self-hosted, Windows, X64]. The test-linux-cuda
#      job runs there via the `deployment` environment gate.

on:
  workflow_dispatch:
    inputs:
      run_gpu_tests:
        description: 'Run paid GPU test job (linux_4_core_gpu, ~$0.15/run)'
        type: boolean
        default: true

env:
  # CUDA arch list used by Linux+Windows CUDA builds. See wheels_plan.md
  # "CUDA arch list" section for the rationale (covers every NVIDIA GPU
  # from Maxwell to Blackwell via explicit SASS + minor-version forward compat).
  CUDA_ARCH: "50;60;70;75;80;86;89;90;100;120"
  # Pre-built CUDA test image (pushed by build-test-image.yml). Owner is
  # hardcoded because the workflow is already gated to the canonical repo.
  TEST_CUDA_IMAGE: ghcr.io/daniil-shmelev/pysiglib-test-cuda12:cuda-12.9.1

jobs:
  # ============================================================
  # Linux CPU wheel
  # ============================================================
  build-linux-cpu:
    name: Build Linux CPU wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ENVIRONMENT: CUSIG=OFF PYSIGLIB_JAX_FFI=OFF SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-cpu
          path: wheelhouse/*.whl

  # ============================================================
  # Linux CUDA wheel (uses ghcr.io custom manylinux+CUDA image)
  # ============================================================
  build-linux-cuda:
    name: Build Linux CUDA wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Compute image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/pysiglib-manylinux-cuda12:cuda-12.9.1" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ steps.image.outputs.name }}
          # CUDA_ARCH value contains semicolons, which cibuildwheel's shell-style
          # env parser treats as statement terminators unless quoted. Wrap in
          # double quotes so the semicolons stay inside the value.
          CIBW_ENVIRONMENT: 'CUSIG=ON PYSIGLIB_JAX_FFI=OFF SIGLIB_VEC=ON CUDA_ARCH="${{ env.CUDA_ARCH }}"'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-cuda
          path: wheelhouse/*.whl

  # ============================================================
  # Windows CPU wheel
  # ============================================================
  build-windows-cpu:
    name: Build Windows CPU wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ENVIRONMENT: CUSIG=OFF PYSIGLIB_JAX_FFI=OFF SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-cpu
          path: wheelhouse/*.whl

  # ============================================================
  # Windows CUDA wheel (CUDA installed natively via Jimver action)
  # ============================================================
  build-windows-cuda:
    name: Build Windows CUDA wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install CUDA toolkit
        # v0.2.35 is the first Jimver release to support CUDA 12.9.1 on Windows.
        # Older v0.2.21 only supported up to 12.8.0.
        #
        # sub-packages must use Windows-native NVIDIA installer names, not
        # Linux package names. `cudart_dev` doesn't exist as a Windows
        # sub-package — `cudart` already bundles runtime libs + headers on
        # Windows.
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "thrust", "visual_studio_integration"]'
      - name: Verify nvcc
        shell: pwsh
        run: nvcc --version
      - uses: pypa/cibuildwheel@v2.21
        env:
          # CUDA_ARCH value contains semicolons — must be quoted so cibuildwheel's
          # shell-style env parser doesn't split on them.
          CIBW_ENVIRONMENT: 'CUSIG=ON PYSIGLIB_JAX_FFI=OFF SIGLIB_VEC=ON CUDA_ARCH="${{ env.CUDA_ARCH }}"'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-cuda
          path: wheelhouse/*.whl

  # ============================================================
  # macOS wheel (CPU-only, both arm64 and x86_64 via cibuildwheel archs config)
  # ============================================================
  build-macos:
    name: Build macOS wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ENVIRONMENT: CUSIG=OFF PYSIGLIB_JAX_FFI=OFF SIGLIB_VEC=ON
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: wheelhouse/*.whl

  # ============================================================
  # Test jobs — install the built wheels in a fresh environment and
  # run the test suite. These validate both "the wheel installs cleanly"
  # and "the Python code continues to work end-to-end" across the minimum
  # (3.9) and latest (3.13) Python versions we support.
  # ============================================================

  test-linux-cpu:
    name: Test Linux CPU wheel (py${{ matrix.python-version }})
    needs: build-linux-cpu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cpu
          path: dist
      - name: Install wheel + test deps
        run: |
          pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest
      - name: Run test suite
        run: pytest tests/ -v

  # ============================================================
  # test-linux-cuda runs on a SELF-HOSTED Windows runner because GHA's free
  # hosted runners don't expose a GPU. The runner has Docker Desktop + WSL2 +
  # the NVIDIA driver, so a Linux container started with --gpus all can reach
  # the host's RTX 4060.
  #
  # The test image is pre-built by build-test-image.yml and pushed to ghcr.io
  # with torch + pytest baked in, so each run only needs to `pip install` the
  # wheel under test (~seconds) instead of redownloading ~2 GB of torch.
  #
  # Security model for the self-hosted runner on a public repo:
  #   1. wheels.yml only triggers on workflow_dispatch (no PR trigger), so
  #      fork PRs structurally cannot fire this job.
  #   2. The actor check below restricts execution to manual triggers from
  #      the canonical repo (defense in depth — even if a future trigger is
  #      added, fork-originated runs still get skipped).
  #   3. The `deployment` environment gate requires manual approval before
  #      the job actually schedules work on the runner.
  #   4. Tests run inside an ephemeral Docker container destroyed with --rm
  #      after the job, so any code that does run cannot persist on the host
  #      or read host files outside the workspace mount.
  test-linux-cuda:
    name: Test Linux CUDA wheel (GPU)
    needs: build-linux-cuda
    if: github.event_name == 'workflow_dispatch' && github.repository == 'daniil-shmelev/pysiglib' && github.event.inputs.run_gpu_tests == 'true'
    environment: deployment
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        # Windows PowerShell 5.1 on self-hosted runners defaults to the
        # 'Restricted' execution policy, which refuses to source GHA's
        # generated .ps1 wrapper scripts. Add -ExecutionPolicy Bypass so
        # workflows run on a fresh runner without the user having to modify
        # the host's execution policy (which would also be a global change
        # affecting other software on the machine).
        shell: 'powershell -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cuda
          path: dist
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull test image
        run: docker pull ${{ env.TEST_CUDA_IMAGE }}
      - name: Run pytest in ephemeral test container with --gpus all
        # pytest-timeout kills any single test that runs longer than 60s, so
        # a hung kernel cannot consume the whole job budget. The self-hosted
        # Windows runner has no bash installed (C:\Windows\System32\bash.exe
        # dispatches to WSL, which isn't set up), so the step runs in
        # powershell. The test script is written to the workspace as LF-only,
        # BOM-less UTF-8 so the Linux container's bash can parse it cleanly.
        run: |
          $scriptBody = @'
          set -e
          # Ubuntu 22.04's system pip (22.0.2) mis-resolves PEP 508 direct-URL
          # dependencies like `kauri @ git+https://...`, producing "project
          # name unknown" and then falling back to an unrelated kauri on PyPI.
          # Upgrading to a modern pip fixes the resolver. No-op once
          # Dockerfile.test-cuda is rebuilt (upgrade is baked in there too).
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet /workspace/dist/*.whl
          nvidia-smi
          python3 -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
          python3 -c "import pysiglib; print('BUILT_WITH_CUDA:', pysiglib.load_siglib.BUILT_WITH_CUDA)"
          pytest /workspace/tests/ -v --timeout=60
          '@
          $ws = $env:GITHUB_WORKSPACE
          $scriptPath = Join-Path $ws "run-cuda-tests.sh"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($scriptPath, $scriptBody.Replace("`r`n", "`n"), $utf8NoBom)
          docker run --rm --gpus all `
            -v "${ws}:/workspace" `
            -w /tmp `
            ${{ env.TEST_CUDA_IMAGE }} `
            bash /workspace/run-cuda-tests.sh

  test-windows-cpu:
    name: Test Windows CPU wheel (py${{ matrix.python-version }})
    needs: build-windows-cpu
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-cpu
          path: dist
      - name: Install wheel + test deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          Get-ChildItem dist\*.whl | ForEach-Object { pip install $_.FullName }
          pip install pytest
      - name: Run CPU test suite
        shell: pwsh
        run: pytest tests/ -v

  test-macos:
    name: Test macOS wheel (py${{ matrix.python-version }})
    needs: build-macos
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos
          path: dist
      - name: Install wheel + test deps
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest
      - name: Run CPU test suite
        run: pytest tests/ -v

  # ============================================================
  # Aggregate all built wheels into one downloadable artifact
  # ============================================================
  collect-wheels:
    name: Collect all wheels
    needs:
      - build-linux-cpu
      - build-linux-cuda
      - build-windows-cpu
      - build-windows-cuda
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List collected wheels
        run: |
          ls -la dist/
          echo ""
          for f in dist/*.whl; do
            size=$(du -h "$f" | cut -f1)
            echo "$size  $(basename "$f")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: dist/*.whl
