name: Build CUDA images

# Builds one or both CUDA container images and pushes them to GHCR:
#   - ghcr.io/<owner>/pysiglib-test-cuda12
#   - ghcr.io/<owner>/pysiglib-manylinux-cuda12
#
# Re-run this when the CUDA runtime / toolkit version changes, or when the
# preinstalled test dependencies in Dockerfile.test-cuda need updating.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which image(s) to build'
        type: choice
        options:
          - both
          - test
          - manylinux
        default: both
        required: true
      cuda_version:
        description: 'CUDA version to tag/build against (e.g. 12.9.1)'
        default: '12.9.1'
        required: true
      cuda_driver:
        description: 'CUDA driver version for the manylinux runfile tag (e.g. 575.57.08)'
        default: '575.57.08'
        required: true
      push_latest:
        description: 'Also tag selected images as :latest'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: deployment
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: test
            dockerfile: Dockerfile.test-cuda
            image_name: pysiglib-test-cuda12
            cache_scope: test-cuda12
            free_disk: false
          - key: manylinux
            dockerfile: Dockerfile.manylinux-cuda12
            image_name: pysiglib-manylinux-cuda12
            cache_scope: manylinux-cuda12
            free_disk: true
    steps:
      - name: Skip if not selected
        id: gate
        run: |
          if [ "${{ github.event.inputs.target }}" = "both" ] || [ "${{ github.event.inputs.target }}" = "${{ matrix.key }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: ${{ steps.gate.outputs.run == 'true' }}

      - name: Free disk space
        if: ${{ steps.gate.outputs.run == 'true' && matrix.free_disk }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup
          df -h

      - name: Set up Docker Buildx
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${{ matrix.image_name }}"
          TAGS="${IMAGE}:cuda-${{ github.event.inputs.cuda_version }}"
          if [ "${{ github.event.inputs.push_latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: ${{ steps.gate.outputs.run == 'true' && matrix.key == 'test' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ github.event.inputs.cuda_version }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      - name: Build and push
        if: ${{ steps.gate.outputs.run == 'true' && matrix.key == 'manylinux' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ github.event.inputs.cuda_version }}
            CUDA_DRIVER=${{ github.event.inputs.cuda_driver }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      - name: Report image size
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          docker images ${{ steps.tags.outputs.image }} --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' || true
