name: CodSpeed Benchmarks

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/codspeed.yml"
      - "CMakeLists.txt"
      - "benchmarks/**"
      - "cmake/**"
      - "siglib/cpsig/**"
      - "siglib/shared/**"
  pull_request:
    paths:
      - ".github/workflows/codspeed.yml"
      - "CMakeLists.txt"
      - "benchmarks/**"
      - "cmake/**"
      - "siglib/cpsig/**"
      - "siglib/shared/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build cpsig + benchmarks
        env:
          CIBUILDWHEEL: "1"  # prefer x86-64-v3; -march=native may emit AVX-512 that Valgrind cannot simulate
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYSIGLIB_BENCHMARKS=ON \
            -DPYSIGLIB_JAX_FFI=OFF \
            -DCODSPEED_MODE=simulation
          cmake --build build --target bench_cpsig -j$(nproc)

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: ./build/benchmarks/bench_cpsig

      - name: Build cpsig + benchmarks for memory
        env:
          CIBUILDWHEEL: "1"
        run: |
          cmake -B build-memory \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYSIGLIB_BENCHMARKS=ON \
            -DPYSIGLIB_JAX_FFI=OFF \
            -DCODSPEED_MODE=memory
          cmake --build build-memory --target bench_cpsig -j$(nproc)

      - name: Run memory benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: memory
          run: ./build-memory/benchmarks/bench_cpsig
