name: CodSpeed Benchmarks

on:
  push:
    branches: ["main"]
    paths: ["siglib/cpsig/**"]
  pull_request:
    paths: ["siglib/cpsig/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cpsig + benchmarks
        env:
          CIBUILDWHEEL: "1"  # prefer x86-64-v3; -march=native may emit AVX-512 that Valgrind cannot simulate
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYSIGLIB_BENCHMARKS=ON \
            -DPYSIGLIB_JAX_FFI=OFF \
            -DCODSPEED_MODE=simulation
          cmake --build build --target bench_cpsig -j$(nproc)

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: ./build/benchmarks/bench_cpsig
