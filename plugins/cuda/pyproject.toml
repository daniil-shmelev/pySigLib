[build-system]
# jaxlib provides the XLA FFI headers the pysiglib_jax_ffi_cuda target
# compiles against. Pinned to match the base pysiglib build (>=0.9.1 for
# XLA_FFI_API_MINOR=3). If absent at build time, FindJaxlib.cmake sets
# JAXLIB_FOUND=FALSE and the plugin falls back to cusig-only (no CUDA FFI).
requires = [
    "scikit-build-core>=0.10",
    "jaxlib>=0.9.1; python_version>='3.11'",
]
build-backend = "scikit_build_core.build"

[project]
name = "pysiglib-cuda"
version = "3.0.0rc1"
description = "CUDA plugin for pysiglib. Ships cusig and pysiglib_jax_ffi_cuda."
requires-python = ">=3.9"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Daniil Shmelev", email = "daniil.shmelev23@imperial.ac.uk" },
]
# Exact pin: cusig's ABI must match the base wheel's ctypes bindings.
dependencies = ["pysiglib==3.0.0rc1"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/daniil-shmelev/pySigLib"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.source-dir = "."
build-dir = "build/{wheel_tag}"
wheel.packages = ["pysiglib_cuda"]
wheel.py-api = "py3"

[tool.scikit-build.cmake.define]
PYSIGLIB_CUDA_ARCH = {env = "CUDA_ARCH", default = "native"}

[tool.cibuildwheel]
build = "cp311-*"
skip = "pp* *-musllinux_* *-win32 *i686"
build-verbosity = 1

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
# Exclude system-CUDA libs AND libcpsig (base wheel ships it) and
# libpysiglib_jax_ffi_cuda itself (bundled by this wheel).
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude 'libcuda.so*' --exclude 'libnvidia-*' --exclude 'libcpsig.so*' --exclude 'libpysiglib_jax_ffi_cuda.so*'"
